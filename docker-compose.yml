services:
  postgres:
    image: postgres:17-alpine
    container_name: brevly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brevly
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # cria brevly_test na primeira subida do volume (Step 2)
      - ./docker:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d brevly']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: brevly-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/brevly
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3333:3333'

  migrate:
    profiles: ['tools']
    restart: 'no'
    build:
      context: .
      dockerfile: server/Dockerfile
      target: builder
    container_name: brevly-migrate
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/brevly
    depends_on:
      postgres:
        condition: service_healthy
    command: ['pnpm', '--filter', 'server', 'db:migrate']

volumes:
  postgres_data:
